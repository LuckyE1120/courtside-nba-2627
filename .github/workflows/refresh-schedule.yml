name: Refresh NBA schedule

on:
  schedule:
    - cron: '30 0,2,5,8,11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: courtside-schedule-deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh published schedule
        run: python3 scripts/build_schedule.py
      - name: Cache recent box scores
        run: python3 scripts/build_recent_boxscores.py
      - name: Save refreshed snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/season-2026-27.json public/recent-boxscores.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh 2026-27 NBA schedule snapshot'
            git push origin HEAD:main
          fi
      - name: Publish refreshed schedule to GitHub Pages
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/courtside-pages origin/gh-pages
          cp public/season-2026-27.json /tmp/courtside-pages/season-2026-27.json
          cp public/recent-boxscores.json /tmp/courtside-pages/recent-boxscores.json
          cd /tmp/courtside-pages
          git add season-2026-27.json recent-boxscores.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish refreshed NBA schedule'
            git push origin HEAD:gh-pages
          fi
